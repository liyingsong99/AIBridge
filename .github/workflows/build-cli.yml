name: Build CLI Multi-Platform

on:
  push:
    branches: [main, dev]
    paths:
      - 'Tools~/AIBridgeCLI/**'
      - 'Tools~/AIBridgeCodeIndex/**'
      - 'Tools~/AIBridgeEditorCapture/**'
      - '.github/workflows/build-cli.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'Tools~/AIBridgeCLI/**'
      - 'Tools~/AIBridgeCodeIndex/**'
      - 'Tools~/AIBridgeEditorCapture/**'
      - '.github/workflows/build-cli.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: AIBridgeCLI.exe
          - os: ubuntu-latest
            rid: linux-x64
            artifact: AIBridgeCLI
          - os: macos-latest
            rid: osx-x64
            artifact: AIBridgeCLI
          - os: macos-latest
            rid: osx-arm64
            artifact: AIBridgeCLI

    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: |
          dotnet publish Tools~/AIBridgeCLI/AIBridgeCLI.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained false \
            -p:PublishSingleFile=true \
            -o Tools~/CLI/${{ matrix.rid }}
          dotnet publish Tools~/AIBridgeCodeIndex/AIBridgeCodeIndex.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained false \
            -p:PublishSingleFile=false \
            -o Tools~/CLI/${{ matrix.rid }}/CodeIndex
        shell: bash

      - name: Build Editor capture helper (Windows)
        if: runner.os == 'Windows'
        run: |
          $outputDir = 'Tools~/CLI/win-x64/EditorCapture'
          if (Test-Path -LiteralPath $outputDir) {
            Remove-Item -LiteralPath $outputDir -Recurse -Force
          }
          dotnet publish Tools~/AIBridgeEditorCapture/Windows/AIBridgeEditorCapture.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -o $outputDir
        shell: pwsh

      - name: Build Editor capture helper (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ "${{ matrix.rid }}" = "osx-arm64" ]; then
            arch="arm64"
          else
            arch="x86_64"
          fi
          output_dir="Tools~/CLI/${{ matrix.rid }}/EditorCapture"
          rm -rf "$output_dir"
          mkdir -p "$output_dir"
          xcrun swiftc -O \
            -target "${arch}-apple-macos12.3" \
            Tools~/AIBridgeEditorCapture/macOS/main.swift \
            -o "$output_dir/AIBridgeEditorCapture"
          chmod +x "$output_dir/AIBridgeEditorCapture"
        shell: bash

      - name: Verify Editor capture helper layout (Windows)
        if: runner.os == 'Windows'
        run: |
          $helper = 'Tools~/CLI/win-x64/EditorCapture/AIBridgeEditorCapture.exe'
          if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) {
            throw "EditorCapture helper was not published: $helper"
          }
        shell: pwsh

      - name: Verify Editor capture helper layout (macOS)
        if: runner.os == 'macOS'
        run: |
          helper="Tools~/CLI/${{ matrix.rid }}/EditorCapture/AIBridgeEditorCapture"
          if [ "${{ matrix.rid }}" = "osx-arm64" ]; then
            expected_arch="arm64"
          else
            expected_arch="x86_64"
          fi
          if [ ! -f "$helper" ]; then
            echo "EditorCapture helper was not built: $helper" >&2
            exit 1
          fi
          if [ ! -x "$helper" ]; then
            echo "EditorCapture helper is not executable: $helper" >&2
            exit 1
          fi
          if ! file -b "$helper" | grep -Eq "Mach-O.*${expected_arch}"; then
            echo "EditorCapture helper does not contain expected Mach-O architecture ${expected_arch}: $helper" >&2
            file "$helper" >&2
            exit 1
          fi
        shell: bash

      - name: Archive platform artifact
        run: |
          tar -cf "Tools~/cli-${{ matrix.rid }}.tar" -C "Tools~/CLI/${{ matrix.rid }}" .
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.rid }}
          path: Tools~/cli-${{ matrix.rid }}.tar
          retention-days: 30

  commit-binaries:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: Tools~/artifacts
          pattern: cli-*
          merge-multiple: true

      - name: Reorganize artifacts
        run: |
          for archive in Tools~/artifacts/cli-*.tar; do
            [ -f "$archive" ] || continue
            rid="$(basename "$archive" .tar | sed 's/^cli-//')"
            rm -rf "Tools~/CLI/$rid"
            mkdir -p "Tools~/CLI/$rid"
            tar -xf "$archive" -C "Tools~/CLI/$rid"
          done
          rm -rf Tools~/artifacts
          ls -la Tools~/CLI/*/

      - name: Verify final Editor capture helper layout
        run: |
          win_helper="Tools~/CLI/win-x64/EditorCapture/AIBridgeEditorCapture.exe"
          osx_x64_helper="Tools~/CLI/osx-x64/EditorCapture/AIBridgeEditorCapture"
          osx_arm64_helper="Tools~/CLI/osx-arm64/EditorCapture/AIBridgeEditorCapture"

          for helper in "$win_helper" "$osx_x64_helper" "$osx_arm64_helper"; do
            if [ ! -f "$helper" ]; then
              echo "Expected EditorCapture helper is missing after artifact reorganization: $helper" >&2
              exit 1
            fi
          done

          for helper in "$osx_x64_helper" "$osx_arm64_helper"; do
            if [ ! -x "$helper" ]; then
              echo "macOS EditorCapture helper is not executable after artifact reorganization: $helper" >&2
              exit 1
            fi
          done
        shell: bash

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Tools~/CLI/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update CLI binaries for all platforms"
            git push origin HEAD:${{ github.ref_name }}
          fi
